    }
    .noscript-message {
      font-size: 16px;

      margin-bottom: 20px;
    }
    .noscript-help {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>

  <title>Birthday Celebration - Interactive Cake & Confetti</title>
</head>

<body>
  <!-- Enhanced noscript experience -->
  <noscript>
    <div class="noscript-container">
      <div class="noscript-content">
        <div class="noscript-title">🎂 JavaScript Required</div>
        <div class="noscript-message">
          This interactive birthday celebration app requires JavaScript to run.
          Please enable JavaScript in your browser settings to enjoy the animated cake,
          microphone interactions, and confetti celebrations!
        </div>
        <div class="noscript-help">
          <strong>Need help?</strong> Search for "enable JavaScript" + your browser name
          for step-by-step instructions.
        </div>
      </div>
    </div>
  </noscript>

  <!-- Main app container -->
  <div id="root" role="application" aria-label="Birthday Celebration App"></div>

  <!-- Performance and accessibility features -->
  <script>
    // Detect user preferences for accessibility
    (function() {
      // Check for reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.setAttribute('data-reduced-motion', 'true');
      }

      // Check for color scheme preference
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      // Add loading state class
      document.documentElement.classList.add('app-loading');

      // Remove loading class when page is fully loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.documentElement.classList.remove('app-loading');
          document.documentElement.classList.add('app-loaded');
        }, 100);
      });

      // Handle visibility change for performance optimization
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          document.documentElement.setAttribute('data-page-hidden', 'true');
        } else {
          document.documentElement.removeAttribute('data-page-hidden');
        }
      });

      // Monitor performance in development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = performance.getEntriesByType('navigation')[0];
            console.log('Page Load Performance:');
            console.log('- DOM Content Loaded:', perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart, 'ms');
            console.log('- Page Load:', perfData.loadEventEnd - perfData.loadEventStart, 'ms');
            console.log('- Total Load Time:', perfData.loadEventEnd - perfData.fetchStart, 'ms');
          }, 0);
        });
      }
    })();
  </script>

</body>
